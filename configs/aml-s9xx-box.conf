# Amlogic TV boxes. Armbian board file: config/boards/aml-s9xx-box.tvb (TV-box tier, meson-gxl family).
# Defaults to the S905X reference DTB (meson-gxl-s905x-p212); S905X2 units need the overrides in
# userpatches/config/boards/aml-s9xx-box.tvb and a chainloaded u-boot.ext. BOOTFS_TYPE=fat is already set by the board file.
BOARD="aml-s9xx-box"
BRANCH="current"
RELEASE="trixie"
EXTRA_BUILD_ARGS=()
