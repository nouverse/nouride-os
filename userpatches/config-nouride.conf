# ─────────────────────────────────────────────────────────────────────────────
# Nouride OS — Armbian build configuration
# Loaded only because build.sh passes "nouride" to compile.sh (config-<name>.conf);
# Armbian never auto-loads config-default.conf. Command-line params override this file.
# ─────────────────────────────────────────────────────────────────────────────

BUILD_MINIMAL="yes"
BUILD_DESKTOP="no"
KERNEL_CONFIGURE="no"

# Minimal defaults to systemd-networkd + systemd-timesyncd. This selects NetworkManager + netplan + chrony
# (and Armbian disables NetworkManager-wait-online, so network-online.target is not a real "online" gate).
NETWORKING_STACK="network-manager"

# Armbian defaults: root autologin on HDMI and serial consoles, root password 1234, PermitRootLogin yes.
# The first is switched off here; customize-image.sh handles the other two.
CONSOLE_AUTOLOGIN="no"

HOST="nouride"                # /etc/hostname and both /etc/hosts lines (default is the board name)
VENDOR="Nouride-OS"           # image file prefix, /etc/issue, MOTD (default "Armbian-unofficial")
COMPRESS_OUTPUTIMAGE="sha,xz" # COMPRESS_OUTPUT does not exist; the default "sha,img" leaves a raw .img

# NetworkManager only Recommends dnsmasq-base (needed for hotspot/"shared" mode, i.e. Box onboarding) and polkitd,
# and Armbian installs with --no-install-recommends. PACKAGE_LIST_ADDITIONAL/PACKAGE_LIST_EXCLUDE are not read.
add_packages_to_image dnsmasq-base
