# ─────────────────────────────────────────────────────────────────────────────
# Nouride OS — Armbian Default Minimal Build Configuration
# ─────────────────────────────────────────────────────────────────────────────

BUILD_MINIMAL="yes"
BUILD_DESKTOP="no"
KERNEL_CONFIGURE="no"
EXPERT="yes"
COMPRESS_OUTPUT="yes"
ROOTFS_TYPE="ext4"

# Disable bloatware packages
PACKAGE_LIST_ADDITIONAL="network-manager zram-tools fake-hwclock curl ca-certificates jq"
PACKAGE_LIST_EXCLUDE="pulseaudio bluetooth bluez cups avahi-daemon plymouth"
